<!doctype html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sudoku</title>

  <!-- Serif font for title -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg: #ffffff;
      --text: #111111;
      --muted: #666666;
      --line: #cccccc;
      --accent: #111111;
      --bad: #b00020;

      --grid-bg: #f4f4f4;
      --cell-border: #dddddd;
      --subgrid: #999999;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height:100vh;
      display:grid;
      place-items:center;
    }

    .app{
      width: min(900px, 95vw);
      padding: 24px;
    }

    header{
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      align-items:center;
      gap:16px;
      margin-bottom:16px;
      max-width:540px;
      margin-inline:auto;
    }

    .title{
      margin:0;
      font-family: "Playfair Display", serif;
      font-size: 48px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .controls{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      justify-content:center;
    }

    button{
      border:1px solid var(--line);
      background:#ffffff;
      color:var(--text);
      padding:8px 14px;
      border-radius:6px;
      font-size:14px;
      cursor:pointer;
      min-height:38px;
    }

    button:hover{
      background:#f2f2f2;
    }

    .status{
      width:100%;
      text-align:center;
      font-size:13px;
      color:var(--muted);
      margin-top:4px;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(9,1fr);
      width:min(540px, 92vw);
      aspect-ratio:1/1;
      margin:0 auto;
      border:2px solid var(--line);
      background:var(--grid-bg);
    }

    .cell{
      border:1px solid var(--cell-border);
      display:grid;
      place-items:center;
      font-size:clamp(18px, 3vw, 24px);
    }

    .cell input{
      width:100%;
      height:100%;
      border:0;
      background:transparent;
      text-align:center;
      font-size:inherit;
      color:var(--text);
      outline:none;
      caret-color:transparent;
    }

    .cell.given input{
      font-weight:600;
    }

    .cell.selected{
      outline:2px solid var(--accent);
      outline-offset:-2px;
    }

    .cell.same{
      background:#eaeaea;
    }

    .cell.bad input{
      color:var(--bad);
      font-weight:600;
    }

    .cell.subgrid-right{
      border-right:2px solid var(--subgrid);
    }
    .cell.subgrid-bottom{
      border-bottom:2px solid var(--subgrid);
    }

    /* Mobil keypad */
    .keypad{
      width:min(540px, 92vw);
      margin:16px auto 0;
      display:none;
      grid-template-columns:repeat(4,1fr);
      gap:10px;
    }

    .keypad button{
      min-height:44px;
      font-size:16px;
      border-radius:6px;
    }

    .keypad button[data-action="erase"]{
      grid-column: span 3;
    }

    @media (max-width:768px){
      .keypad{ display:grid; }
      .title{ font-size:42px; }
    }

    @media (max-width:480px){
      .title{ font-size:36px; }
      .app{ padding:16px; }
    }
  </style>
</head>

<body>
<div class="app">

  <header>
    <h1 class="title">Sudoku</h1>

    <div class="controls">
      <button id="newGame">Nytt spill</button>
      <button id="check">Sjekk</button>
      <button id="reveal">Vis løsning</button>
    </div>

    <span id="status" class="status"></span>
  </header>

  <div id="grid" class="grid"></div>

  <div id="keypad" class="keypad">
    <button data-value="1">1</button>
    <button data-value="2">2</button>
    <button data-value="3">3</button>
    <button data-value="4">4</button>

    <button data-value="5">5</button>
    <button data-value="6">6</button>
    <button data-value="7">7</button>
    <button data-value="8">8</button>

    <button data-value="9">9</button>
    <button data-action="erase">Slett</button>
  </div>

</div>

<script>
